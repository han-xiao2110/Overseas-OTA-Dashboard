name: Daily Auto-Update & Deploy

on:
  schedule:
    # UTC 周一至周五 22:00 = 北京时间周二至周六 06:00：更新上一美股交易日收盘价
    - cron: '0 22 * * 1-5'
    # UTC 每天 00:00 = 北京时间每天 08:00：更新新闻（包括周日和周一）
    - cron: '0 0 * * *'
  workflow_dispatch:  # 手动触发按钮

# 私有仓库：Actions 默认有 contents:write 权限，显式声明更稳
permissions:
  contents: write

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt

      - name: Install Surge
        run: npm install -g surge

      # ── 1. 股价（增量抓取，已有缓存自动跳过）──
      - name: Fetch stock prices
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 22 * * 1-5'
        run: python fetch_stock_prices_副本.py
        continue-on-error: true

      - name: Verify stock data updated
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 22 * * 1-5'
        run: |
          python3 -c "
          import json, os, sys
          with open('stock_prices_副本.json') as f:
              data = json.load(f)
          today = __import__('datetime').date.today().isoformat()
          yesterday = (__import__('datetime').date.today() - __import__('datetime').timedelta(days=1)).isoformat()
          for t in ['BKNG', 'EXPE', 'ABNB']:
              if t not in data:
                  print(f'ERROR: {t} missing from stock data')
                  sys.exit(1)
              dates = data[t].get('dates', [])
              last = dates[-1] if dates else 'NONE'
              print(f'{t}: last date = {last}')
          print('Stock data OK')
          "
        continue-on-error: true

      # ── 2. 新闻（全量重抓）──
      - name: Fetch news
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 0 * * *'
        run: python fetch_news_副本.py --force
        continue-on-error: true

      # ── 3. 生成 dashboard（用仓库里的 Excel 财务数据）──
      - name: Generate dashboard
        run: python generate_副本.py

      # ── 4. 部署到 Surge ──
      - name: Deploy to Surge
        env:
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
        run: surge ./deploy bkng-expe-abnb-1q26.surge.sh
        continue-on-error: true

      # ── 5. 把更新后的数据 commit 回仓库 ──
      - name: Commit & push data updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stock_prices_副本.json news_data_副本.json dashboard_data_副本.json || true
          git add news_cache_backups/ 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git commit -m "auto: daily update $(date -u +%Y-%m-%d)"
            git pull --rebase origin main || true
            git push
          else
            echo "No data changes to commit."
          fi
