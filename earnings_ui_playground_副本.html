<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>财报日标注方案 · Playground</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/echarts/5.4.3/echarts.min.js"></script>
<style>
:root{--bg:#131318;--panel:#1b1b22;--line:#2a2a34;--ink:#f2f1ee;--mut:#8f8fa0;--maroon:#800000;--up:#4CAF50;--down:#F44336;--neu:#9E9E9E}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;min-height:100vh;padding:26px clamp(16px,4vw,52px) 44px;background-image:radial-gradient(900px 400px at 85% -10%,rgba(128,0,0,.16),transparent 60%),repeating-linear-gradient(115deg,rgba(255,255,255,.015) 0 1px,transparent 1px 110px)}
.kick{font-size:10px;letter-spacing:3.5px;color:rgba(255,255,255,.42);font-weight:700}
h1{font-family:Georgia,"Times New Roman","Songti SC","SimSun",serif;font-size:clamp(24px,3.2vw,34px);font-weight:700;letter-spacing:2px;margin:8px 0 4px}
.sub{font-size:12px;color:var(--mut);line-height:1.7;max-width:760px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;margin-bottom:18px}
.co-switch{display:flex;gap:8px}
.co-switch button{border:1px solid var(--line);background:transparent;color:var(--mut);font-size:12px;font-weight:700;letter-spacing:1px;padding:7px 16px;border-radius:20px;cursor:pointer;transition:all .2s}
.co-switch button:hover{color:var(--ink);border-color:#4a4a58}
.co-switch button.on{background:var(--maroon);border-color:var(--maroon);color:#fff}
.opt-row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px}
@media(max-width:820px){.opt-row{grid-template-columns:1fr}}
.opt-tab{position:relative;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:14px 16px;cursor:pointer;transition:all .22s;text-align:left}
.opt-tab:hover{border-color:#4a4a58;transform:translateY(-2px)}
.opt-tab.on{border-color:var(--maroon);box-shadow:0 0 0 1px var(--maroon),0 10px 26px rgba(128,0,0,.22)}
.opt-tab .id{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.opt-tab .letter{width:24px;height:24px;border-radius:7px;background:#2c2c36;color:var(--ink);font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;font-family:Georgia,serif}
.opt-tab.on .letter{background:var(--maroon)}
.opt-tab .nm{font-size:14px;font-weight:700;letter-spacing:.5px}
.opt-tab .tag{font-size:9px;font-weight:700;letter-spacing:1px;color:#ffb4a8;border:1px solid rgba(255,180,168,.4);padding:1px 7px;border-radius:20px;margin-left:auto}
.opt-tab .ds{font-size:11px;color:var(--mut);line-height:1.65}
.chart-card{background:#fff;border-radius:14px;padding:16px 18px 10px;box-shadow:0 18px 50px rgba(0,0,0,.45)}
.chart-head{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px;margin-bottom:4px}
.chart-head .t{font-size:14px;font-weight:700;color:#1a1a1f}
.chart-head .t span{font-size:11px;color:#9a9aa5;font-weight:400;margin-left:6px}
.legend-row{display:flex;gap:14px;font-size:11px;color:#6a6a75}
.legend-row i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}
#pg{width:100%;height:430px}
.detail{display:flex;gap:12px;flex-wrap:wrap;margin-top:14px}
.d-card{flex:1;min-width:250px;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:13px 16px}
.d-card .h{font-size:10px;letter-spacing:2px;color:rgba(255,255,255,.40);font-weight:700;margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{font-size:11px;padding:4px 11px;border-radius:20px;border:1px solid var(--line);color:#cfced6}
.chip.good{border-color:rgba(76,175,80,.45);color:#9fd8a2;background:rgba(76,175,80,.08)}
.chip.bad{border-color:rgba(244,67,54,.40);color:#f0a29b;background:rgba(244,67,54,.07)}
.foot{margin-top:16px;font-size:10.5px;color:#5c5c68;letter-spacing:.4px;text-align:center}
</style>
</head>
<body>

<div class="top">
  <div>
    <div class="kick">EARNINGS ANNOTATION &middot; UI OPTIONS</div>
    <h1>财报日标注 · 三方案对比</h1>
    <div class="sub">真实数据（2024-01 至今，Compare sheet 第68行点评）。三个方案共用同一套升级版悬停卡片：色带抬头 + 「超预期/不及预期」结论 + 幅度徽章 + 完整点评。切换公司与方案查看效果。</div>
  </div>
  <div class="co-switch" id="coSwitch">
    <button data-co="BKNG" class="on">BKNG</button>
    <button data-co="EXPE">EXPE</button>
    <button data-co="ABNB">ABNB</button>
  </div>
</div>

<div class="opt-row" id="optRow"></div>

<div class="chart-card">
  <div class="chart-head">
    <div class="t" id="chartTitle">Booking Holdings<span>股价 (USD) · 财报日标注演示</span></div>
    <div class="legend-row">
      <span><i style="background:var(--up)"></i>超预期 / 上调</span>
      <span><i style="background:var(--down)"></i>不及预期 / 下调</span>
      <span><i style="background:var(--neu)"></i>中性</span>
    </div>
  </div>
  <div id="pg"></div>
</div>

<div class="detail">
  <div class="d-card"><div class="h">优点</div><div class="chips" id="pros"></div></div>
  <div class="d-card"><div class="h">取舍</div><div class="chips" id="cons"></div></div>
</div>

<div class="foot">仅本地演示，未改动线上看板 &middot; 选定方案后我会应用到市场行情 tab 并部署</div>

function hexToRgb(hex){var h=hex.replace('#','');return [parseInt(h.substr(0,2),16),parseInt(h.substr(2,2),16),parseInt(h.substr(4,2),16)];}
function tsToDate(ts){var d=new Date(ts);var m=d.getUTCMonth()+1,dd=d.getUTCDate();return d.getUTCFullYear()+'-'+(m<10?'0':'')+m+'-'+(dd<10?'0':'')+dd;}
function findEarnings(co,date){return DATA.earnings.find(function(e){return e.company===co&&e.date===date;});}
function findGuidance(co,q){return DATA.guidance.find(function(g){return g.company===co&&g.quarter===q;});}
function priceAt(co,date){var arr=DATA.prices[co];for(var i=0;i<arr.length;i++){if(arr[i][0]>=date)return arr[i][1];}return arr[arr.length-1][1];}

/* upgraded tooltip card shared by all options */
function earningsCard(g,date){
  var c=G_COLORS[g.type],rgb=hexToRgb(c).join(',');
  var h='<div style="margin-top:8px;border-radius:9px;overflow:hidden;border:1px solid rgba('+rgb+',.35);min-width:236px;box-shadow:0 8px 20px rgba(20,20,31,.10)">';
  h+='<div style="background:'+c+';color:#fff;padding:6px 10px;display:flex;justify-content:space-between;align-items:baseline">';
  h+='<span style="font-size:11px;font-weight:800;letter-spacing:1px">'+g.quarter+' 财报日</span>';
  h+='<span style="font-size:10px;opacity:.82;font-variant-numeric:tabular-nums">'+date+'</span></div>';
  h+='<div style="padding:8px 10px;background:#fff">';
  h+='<div style="display:flex;align-items:center;gap:8px">';
  h+='<span style="font-size:13px;font-weight:800;color:'+c+'">'+ARROW[g.type]+' '+VERDICT[g.type]+'</span>';
  if(g.pct) h+='<span style="font-size:10px;font-weight:700;color:'+c+';background:rgba('+rgb+',.10);border:1px solid rgba('+rgb+',.30);padding:1px 8px;border-radius:20px;font-variant-numeric:tabular-nums">'+g.pct+'</span>';
  h+='</div>';
  h+='<div style="font-size:11px;color:#5a5f6b;line-height:1.65;margin-top:5px">'+g.text+'</div>';
  h+='</div></div>';
  return h;
}

function mainTooltip(co){
  return {
    trigger:'axis',backgroundColor:'rgba(255,255,255,.98)',borderColor:'#e2e2e8',borderWidth:1,
    textStyle:{color:'#333',fontSize:12},
    formatter:function(params){
      if(!params||!params.length)return '';
      var date=tsToDate(params[0].value[0]);
      var s='<div style="font-weight:600;font-size:12px;margin-bottom:3px">'+date+'</div>';
      params.forEach(function(p){
        var v=p.value&&p.value[1];
        if(v!==null&&v!==undefined){
          s+='<div style="display:flex;align-items:center;gap:6px;margin:2px 0">'+p.marker+'<span>'+p.seriesName+': <b>$'+v.toFixed(2)+'</b></span></div>';
        }
      });
      var e=findEarnings(co,date);
      if(e){
        var g=findGuidance(co,e.quarter);
        if(g) s+=earningsCard(g,date);
        else s+='<div style="margin-top:6px;font-size:11px;color:#8a8f98">'+e.quarter+' 财报日</div>';
      }
      return s;
    }
  };
}

function priceSeries(co){
  return {name:CO_NAMES[co],type:'line',data:DATA.prices[co],lineStyle:{width:2.2},smooth:false,symbol:'none',itemStyle:{color:CO_COLORS[co]},z:2};
}
function coEarnings(co){return DATA.earnings.filter(function(e){return e.company===co;});}

/* ---------- Option A: pill badges on softened lines ---------- */
function optionA(co){
  var ser=priceSeries(co);
  ser.markLine={symbol:'none',silent:true,animation:false,data:coEarnings(co).map(function(e){
    var g=findGuidance(co,e.quarter);
    var t=g?g.type:'neutral',c=G_COLORS[t];
    var num=g?(g.pct||'').replace('%','').replace('+','').replace('-',''):'';
    var txt=e.quarter+(t!=='neutral'?(ARROW[t]+(num?num+'%':'')):'');
    return {xAxis:e.date,
      label:{show:true,position:'end',distance:3,formatter:'{p|'+txt+'}',
        rich:{p:{backgroundColor:c,color:'#fff',borderRadius:8,padding:[2,6,2,6],fontSize:9,fontWeight:700,lineHeight:12}}},
      lineStyle:{type:'dashed',color:c,width:1,opacity:.5}};
  })};
  return {animation:false,tooltip:mainTooltip(co),legend:{show:false},
    grid:{left:56,right:24,top:32,bottom:42},
    xAxis:{type:'time',axisLabel:{color:'#666',hideOverlap:true},axisTick:{show:false}},
    yAxis:{type:'value',axisLabel:{formatter:function(v){return '$'+v.toFixed(0);},color:'#666'},splitLine:{lineStyle:{type:'dashed',color:'#e7e7ec'}}},
    dataZoom:[{type:'slider',bottom:6,height:18},{type:'inside'}],
    series:[ser]};
}

/* ---------- Option B: direction studs anchored on the price ---------- */
function optionB(co){
  var ser=priceSeries(co);
  ser.markPoint={silent:true,animation:false,data:coEarnings(co).map(function(e){
    var g=findGuidance(co,e.quarter);
    var t=g?g.type:'neutral',c=G_COLORS[t];
    return {coord:[e.date,priceAt(co,e.date)],
      symbol:(t==='neutral'?'diamond':'triangle'),
      symbolRotate:(t==='down'?180:0),symbolSize:11,
      itemStyle:{color:c,borderColor:'#fff',borderWidth:1.5}};
  })};
  return {animation:false,tooltip:mainTooltip(co),legend:{show:false},
    grid:{left:56,right:24,top:18,bottom:42},
    xAxis:{type:'time',axisLabel:{color:'#666',hideOverlap:true},axisTick:{show:false}},
    yAxis:{type:'value',axisLabel:{formatter:function(v){return '$'+v.toFixed(0);},color:'#666'},splitLine:{lineStyle:{type:'dashed',color:'#e7e7ec'}}},
    dataZoom:[{type:'slider',bottom:6,height:18},{type:'inside'}],
    series:[ser]};
}

/* ---------- Option C: separate event lane under the price ---------- */
function optionC(co){
  var ser=priceSeries(co);
  ser.markLine={symbol:'none',silent:true,animation:false,data:coEarnings(co).map(function(e){
    var g=findGuidance(co,e.quarter);
    var c=G_COLORS[g?g.type:'neutral'];
    return {xAxis:e.date,label:{show:false},lineStyle:{type:'solid',color:c,width:1,opacity:.14}};
  })};
  var flags={type:'scatter',xAxisIndex:1,yAxisIndex:1,silent:true,
    data:coEarnings(co).map(function(e){
      var g=findGuidance(co,e.quarter);
      return {value:[e.date,0.5],itemStyle:{color:G_COLORS[g?g.type:'neutral']}};
    }),
    symbol:'roundRect',symbolSize:[42,16],
    label:{show:true,formatter:function(p){return coEarnings(co)[p.dataIndex].quarter;},fontSize:9,color:'#fff',fontWeight:700}};
  return {animation:false,tooltip:mainTooltip(co),legend:{show:false},
    grid:[{left:56,right:24,top:18,bottom:104},{left:56,right:24,height:34,bottom:52}],
    xAxis:[{type:'time',gridIndex:0,axisLabel:{color:'#666',hideOverlap:true},axisTick:{show:false}},
           {type:'time',gridIndex:1,axisLabel:{show:false},axisTick:{show:false},axisLine:{lineStyle:{color:'#e2e2e8'}},splitLine:{show:false}}],
    yAxis:[{type:'value',gridIndex:0,axisLabel:{formatter:function(v){return '$'+v.toFixed(0);},color:'#666'},splitLine:{lineStyle:{type:'dashed',color:'#e7e7ec'}}},
           {type:'value',gridIndex:1,show:false,min:0,max:1}],
    dataZoom:[{type:'slider',xAxisIndex:[0,1],bottom:6,height:18},{type:'inside',xAxisIndex:[0,1]}],
    series:[ser,flags]};
}

  pg.setOption(o,true);
  document.getElementById('chartTitle').innerHTML=CO_NAMES[state.co]+'<span>股价 (USD) · 方案 '+state.opt+' '+OPTS[state.opt].name+'</span>';
  var prosEl=document.getElementById('pros'),consEl=document.getElementById('cons');
  prosEl.innerHTML=OPTS[state.opt].pros.map(function(p){return '<span class="chip good">'+p+'</span>';}).join('');
  consEl.innerHTML=OPTS[state.opt].cons.map(function(p){return '<span class="chip bad">'+p+'</span>';}).join('');
  document.querySelectorAll('#optRow .opt-tab').forEach(function(t){
    t.classList.toggle('on',t.getAttribute('data-opt')===state.opt);
  });
  document.querySelectorAll('#coSwitch button').forEach(function(b){
    b.classList.toggle('on',b.getAttribute('data-co')===state.co);
  });
}

/* build option tabs */
var optRow=document.getElementById('optRow');
Object.keys(OPTS).forEach(function(k){
  var o=OPTS[k];
  var el=document.createElement('div');
  el.className='opt-tab';
  el.setAttribute('data-opt',k);
  el.innerHTML='<div class="id"><span class="letter">'+k+'</span><span class="nm">'+o.name+'</span><span class="tag">'+o.tag+'</span></div><div class="ds">'+o.desc+'</div>';
  el.addEventListener('click',function(){state.opt=k;render();});
  optRow.appendChild(el);
});
document.querySelectorAll('#coSwitch button').forEach(function(b){
  b.addEventListener('click',function(){state.co=b.getAttribute('data-co');render();});
});
window.addEventListener('resize',function(){pg.resize();});
render();
</script>
</body>
</html>
